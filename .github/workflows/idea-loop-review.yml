name: Idea Loop review workflow tests

on:
  pull_request:
    paths:
      - 'idea-loop/**'
      - '.claude-plugin/marketplace.json'
      - '.github/workflows/idea-loop-review.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test GitHub publishing and Workflow host orchestration
        run: node --test idea-loop/scripts/*.test.mjs
