<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>练习记录页</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="page" data-anchor="page">
  <header class="page-head" data-anchor="page-head">
    <h1><img src="assets/mark.svg" alt="" width="20" height="20"> 练习记录</h1>
    <select class="type-filter" data-anchor="type-filter" aria-label="题型筛选">
      <option>全部题型</option><option>口语复述</option><option>学术讨论</option><option>独立写作</option>
    </select>
  </header>
  <div id="groups" data-anchor="groups"></div>
</main>
<script>
  // 状态用 ?state= 切：mixed（混合）/ empty（空态）/ long（长标题加六次 attempt）。名字与方向说明的验收矩阵一致。
  const state = new URLSearchParams(location.search).get('state') || 'mixed';

  const STATUS = { scored: '已评分', failed: '评分失败', grading: '待评分', draft: '草稿' };
  const dims = (d) => `<ul class="dims">${Object.entries(d).map(([k, v]) => `<li>${k} ${v}</li>`).join('')}</ul>`;

  const DATA = {
    mixed: [
      { type: '口语复述', title: '校园咖啡馆装修', status: 'scored', attempts: [
        { n: 3, when: '今天', score: '4.0', d: { 内容: 4.0, 语言: 3.5, 流利度: 4.5 }, comment: '上次说的「例子不够具体」这次补上了。' },
        { n: 2, when: '3 天前', score: '3.5', d: { 内容: 3.5, 语言: 3.5, 流利度: 3.5 }, comment: '例子不够具体。' },
        { n: 1, when: '一周前', score: '3.0', d: { 内容: 3.0, 语言: 3.0, 流利度: 3.5 }, comment: '开头直接进了细节，没有先给立场。' },
      ] },
      { type: '学术讨论', title: '远程办公的利弊', status: 'grading', attempts: [
        { n: 2, when: '刚刚', score: '—', d: {}, comment: '' },
        { n: 1, when: '2 天前', score: '3.5', d: { 内容: 3.5, 语言: 3.0 }, comment: '观点之间缺少连接。' },
      ] },
      { type: '听后复述', title: '植物学讲座', status: 'failed', attempts: [{ n: 1, when: '昨天', score: '—', d: {}, comment: '' }] },
      { type: '独立写作', title: '城市绿地与居民健康', status: 'draft', attempts: [] },
    ],
    empty: [],
    long: [
      { type: '学术讨论', title: '大学是否应当把一年中的某一学期专门用于校外实践而不是课堂教学：对学习效果、就业与教师工作量的影响', status: 'scored', attempts: [6, 5, 4, 3, 2, 1].map((n) => ({ n, when: `${7 - n} 周前`, score: (2.5 + n * 0.25).toFixed(1), d: { 内容: 3.0, 语言: 3.0 }, comment: '例子不够具体。' })) },
    ],
  };

  const root = document.getElementById('groups');
  const groups = DATA[state] || DATA.mixed;
  if (!groups.length) {
    root.innerHTML = '<div class="empty-state" data-anchor="empty-state">还没有练习记录。去练一道题吧。</div>';
  } else {
    root.innerHTML = groups.map((g, gi) => {
      const [first, ...rest] = g.attempts;
      const expanded = first
        ? g.status === 'failed'
          ? `<div class="attempt-expanded" data-anchor="attempt-expanded"><span class="meta">第 ${first.n} 次 · ${first.when}</span><p class="comment">评分没有出来。</p><button class="retry-button" data-anchor="retry-button" data-group="${gi}">重试</button></div>`
          : `<div class="attempt-expanded" data-anchor="attempt-expanded"><span class="meta">第 ${first.n} 次 · ${first.when} · ${first.score}</span>${dims(first.d)}<p class="comment">${first.comment}</p></div>`
        : '<div class="attempt-expanded" data-anchor="attempt-expanded"><span class="meta">草稿，还没交过</span><p class="comment">继续写</p></div>';
      const rows = rest.map((a) => `<button class="attempt-row" data-anchor="attempt-row" aria-expanded="false"><span>第 ${a.n} 次</span><span class="when">${a.when}</span><span class="score">${a.score}</span></button><div class="attempt-detail">${a.comment}</div>`).join('');
      return `<section class="group-card" data-anchor="group-card"><div class="group-head" data-anchor="group-head"><span class="type-tag" data-anchor="type-tag">${g.type}</span><h2 class="group-title">${g.title}</h2><span class="status-pill" data-anchor="status-pill" data-status="${g.status}">${STATUS[g.status]}</span></div>${expanded}${rows}</section>`;
    }).join('');
  }

  // 点折叠行原地展开，同时收起同一张卡里原来展开的那一行。
  root.addEventListener('click', (e) => {
    const row = e.target.closest('.attempt-row');
    if (row) {
      const card = row.closest('.group-card');
      card.querySelectorAll('.attempt-row[aria-expanded="true"]').forEach((r) => r !== row && r.setAttribute('aria-expanded', 'false'));
      row.setAttribute('aria-expanded', row.getAttribute('aria-expanded') === 'true' ? 'false' : 'true');
    }
    const retry = e.target.closest('.retry-button');
    if (retry) {
      // 模拟时序：点重试 → 待评分 1.3 秒 → 已评分。
      const card = retry.closest('.group-card');
      const pill = card.querySelector('.status-pill');
      pill.dataset.status = 'grading'; pill.textContent = STATUS.grading;
      retry.disabled = true;
      setTimeout(() => { pill.dataset.status = 'scored'; pill.textContent = STATUS.scored; retry.remove(); card.querySelector('.comment').textContent = '3.5'; }, 1300);
    }
  });
</script>
</body>
</html>
