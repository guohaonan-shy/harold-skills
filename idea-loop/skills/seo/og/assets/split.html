<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
{{fontLink}}
<style>
:root { {{vars}} }
{{css}}
.frame{position:absolute;left:0;top:0;bottom:0;width:724px;padding:54px 40px 44px 72px;display:flex;flex-direction:column;z-index:2}
.head{height:52px;flex:none;display:flex;align-items:center}
.head .brand{flex:1 1 0}
.main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:20px 0}
.kicker{flex:none;font-size:16px;color:var(--accent);margin-bottom:20px;max-width:100%}
.tbox{flex:0 1 auto;min-height:0}
.title{flex:none;width:100%}
.sbox{flex:none;height:96px;margin-top:20px}
.sbox:has(.sub:empty){display:none}
.foot{flex:none;height:30px;display:flex;align-items:flex-end}
.foot .site{font-size:20px;max-width:100%}
.panel{position:absolute;right:56px;top:56px;bottom:56px;width:400px;border-radius:32px;overflow:hidden;background:var(--accent-soft);z-index:2}
.visual{position:absolute;inset:0}
.visual img{width:100%;height:100%;object-fit:cover;display:block}
.visual.stat{display:flex;flex-direction:column;justify-content:center;padding:40px 40px;background:var(--accent);color:var(--accent-ink)}
.visual.stat .value{flex:none;font-weight:800;letter-spacing:-0.04em;line-height:1;white-space:nowrap;overflow:hidden;max-width:100%}
.visual.stat .rulebar{width:64px;height:8px;background:var(--accent-ink);opacity:0.55;margin:22px 0}
.visual.stat .labelbox{flex:none;height:120px}
.visual.stat .label{font-weight:600;line-height:1.3;opacity:0.9;overflow-wrap:anywhere}
.visual.rings svg{width:100%;height:100%;display:block}
</style>
</head>
<body>
<div class="frame">
  <div class="head">{{brandHtml}}</div>
  <div class="main">
    <div class="kicker" data-fit="16">{{kicker}}</div>
    <div class="tbox"><h1 class="title" data-fit="{{titleFit}}">{{title}}</h1></div>
    <div class="sbox"><p class="sub" data-fit="24:18">{{sub}}</p></div>
  </div>
  <div class="foot"><div class="site" data-fit="20">{{site}}</div></div>
</div>
<div class="panel">{{visual}}</div>
<canvas id="grain" class="grain" width="1200" height="630"></canvas>
<script>{{js}}</script>
</body>
</html>
