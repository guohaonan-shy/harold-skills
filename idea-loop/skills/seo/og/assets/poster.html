<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
{{fontLink}}
<style>
:root { {{vars}} }
{{css}}
.ring{position:absolute;right:-170px;top:-190px;width:620px;height:620px;border-radius:50%;border:56px solid var(--accent-soft)}
.dot{position:absolute;right:92px;top:168px;width:34px;height:34px;border-radius:50%;background:var(--accent)}
.frame{position:absolute;inset:0;padding:54px 72px 44px;display:flex;flex-direction:column;z-index:2}
.head{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:32px}
.head .brand{flex:1 1 0}
.head .kicker{flex:0 1 auto;min-width:0;max-width:560px;font-size:16px;color:var(--accent);border:2px solid var(--accent);border-radius:999px;padding:9px 18px}
.main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;padding-top:24px}
.rule{flex:none;width:96px;height:12px;background:var(--accent);margin-bottom:30px}
.tbox{flex:0 1 auto;min-height:0}
.title{flex:none;width:100%;max-width:1000px}
.sbox{flex:none;height:84px;margin-top:24px}
.sbox:has(.sub:empty){display:none}
.sub{max-width:900px}
.foot{flex:none;height:44px;margin-top:22px;border-top:2px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between}
.foot .site{font-size:20px;max-width:100%}
</style>
</head>
<body>
<div class="ring"></div><div class="dot"></div>
<div class="frame">
  <div class="head">{{brandHtml}}<div class="kicker" data-fit="16">{{kicker}}</div></div>
  <div class="main">
    <div class="rule"></div>
    <div class="tbox"><h1 class="title" data-fit="{{titleFit}}">{{title}}</h1></div>
    <div class="sbox"><p class="sub" data-fit="28:20">{{sub}}</p></div>
  </div>
  <div class="foot"><div class="site" data-fit="20">{{site}}</div></div>
</div>
<canvas id="grain" class="grain" width="1200" height="630"></canvas>
<script>{{js}}</script>
</body>
</html>
