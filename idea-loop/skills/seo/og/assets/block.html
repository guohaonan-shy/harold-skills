<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
{{fontLink}}
<style>
:root { {{vars}} }
{{css}}
.slab{position:absolute;left:0;top:0;width:812px;height:630px;background:var(--accent);clip-path:polygon(0 0,100% 0,calc(100% - 104px) 100%,0 100%);z-index:1}
.slab::after{content:"";position:absolute;right:-60px;bottom:-120px;width:360px;height:360px;border-radius:50%;background:var(--accent-ink);opacity:0.07}
.copy{position:absolute;left:0;top:0;width:700px;height:630px;padding:64px 0 60px 72px;display:flex;flex-direction:column;z-index:2;color:var(--accent-ink)}
.copy .kicker{flex:none;font-size:17px;opacity:0.78;max-width:560px;margin-bottom:26px}
.copy .rule{flex:none;width:80px;height:10px;background:var(--accent-ink);opacity:0.9;margin-bottom:30px}
.tbox{flex:1;min-height:0;display:flex;align-items:flex-start;width:560px}
.title{flex:none;width:100%}
.side{position:absolute;left:864px;right:56px;top:56px;bottom:52px;display:flex;flex-direction:column;z-index:2}
.side .head{height:52px;flex:none;display:flex;align-items:center}
.side .head .brand{flex:1 1 0}
.sbox{flex:1;min-height:0;display:flex;align-items:center}
.sub{flex:none;width:100%;color:var(--ink);font-weight:600;border-left:6px solid var(--accent);padding-left:20px}
.sbox:has(.sub:empty){visibility:hidden}
.side .foot{flex:none;height:30px;display:flex;align-items:flex-end}
.side .site{font-size:20px;max-width:100%}
</style>
</head>
<body>
<div class="slab"></div>
<div class="copy">
  <div class="kicker" data-fit="17">{{kicker}}</div>
  <div class="rule"></div>
  <div class="tbox"><h1 class="title" data-fit="{{titleFit}}">{{title}}</h1></div>
</div>
<div class="side">
  <div class="head">{{brandHtml}}</div>
  <div class="sbox"><p class="sub" data-fit="28:18">{{sub}}</p></div>
  <div class="foot"><div class="site" data-fit="20">{{site}}</div></div>
</div>
<canvas id="grain" class="grain" width="1200" height="630"></canvas>
<script>{{js}}</script>
</body>
</html>
